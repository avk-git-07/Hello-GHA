name: Variable Demo
on:
  push:
    branches:
      - main
      - develop
      - "release/**"

  pull_request:
    branches:
      - main

jobs:
  buuild:
    runs-on: ubuntu-latest
    steps:
      - name: variable demo
        run: echo "Hi, ${{vars.my_name}}"

