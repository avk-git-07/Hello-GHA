name: Demo of Environment Variables
on: 
  workflow_dispatch:
    inputs:
      environment:
        description: Select the preferred environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod
      artifact_tag:
        description: Enter the artifact version
        required: true
jobs:
  env_wise_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "Deploying the app in the ${{ inputs.environment }} environment of the version ${{ inputs.artifact_tag }}."
